{% extends "base.html" %}
{% block title %}Profile - Wrkit{% endblock %}
{% block content %}
<div class="form-card animate-card" style="max-width: 400px; margin: auto;">
    <h2>👤 User Profile</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p style="color: green; font-weight: bold;">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
    
    <form method="POST">
        <input type="hidden" name="action" value="update">
        <label>Username:</label>
        <input type="text" name="username" value="{{ current_user.username }}" required class="input-box">
        <label>Email:</label>
        <input type="email" value="{{ current_user.email }}" disabled class="input-box" style="background:#f1f2f6;">
        <button type="submit" class="btn-gradient">Update Profile</button>
    </form>

    <hr style="margin: 30px 0; border:0; border-top:1px solid #eee;">
    
    <div style="display: flex; justify-content: space-between;">
        <a href="/logout" style="color: #ff4757; text-decoration: none; font-weight: bold;">Logout</a>
        <form method="POST" onsubmit="return confirm('Are you sure you want to delete your account?');">
            <input type="hidden" name="action" value="delete_account">
            <button type="submit" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">Delete Account</button>
        </form>
    </div>
</div>
{% endblock %}
