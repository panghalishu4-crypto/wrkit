<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Wrkit{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- SEO Meta Tags -->
    <title>wrkit - Read & Publish Web Novels Online</title>
    <meta name="description" content="wrkit is a free web novel platform. Read, write, and publish your original stories and web novels with the world.">
    <meta name="keywords" content="web novel, read novels online, fiction writing, webnovel platform, wrkit">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="wrkit - Web Novel Platform">
    <meta property="og:description" content="Read and write original web novels on wrkit.">
    <meta property="og:type" content="website">
</head>
<body>
    <nav class="navbar">
        <h2>Wrkit 📚</h2>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/search">Search</a>
            <a href="/write">Write</a>
            <a href="/library">Library</a>
            <a href="/profile">Profile</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
